name: Suggest a speaker
description: Propose someone to invite (yourself included)
title: "[Speaker] "
labels: ["speaker"]
body:
  - type: input
    id: speaker
    attributes:
      label: Speaker
      placeholder: Name, affiliation
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Web page (optional)
  - type: textarea
    id: topic
    attributes:
      label: Suggested topic / talk
      placeholder: What would they talk about, and why is it useful for the EF mission?
    validations:
      required: true
  - type: dropdown
    id: contact
    attributes:
      label: Do you have a contact with them?
      options:
        - "Yes, I can make the introduction"
        - "No, cold invite"
  - type: input
    id: proposer
    attributes:
      label: Your name (optional)
